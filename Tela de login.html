<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFood - Login</title>
    <link rel="stylesheet" href="./css/index.CSS">
</head>
<body>
    <!-- DIV principal que centraliza o conteúdo -->
    <div id="login">
        <div class="caixa">

            <!-- Logo -->
            <img class="logo" src="img/Logo.Ifood.png" alt="Logo do iFood">

            <!-- Formulário -->
            <form action="#" method="post">

                <div class="campo">
                    <label for="email">Digite seu e-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Digite sua senha</label>
                    <input type="password" id="senha" name="senha" required>
                    <p class="recuperacao-senha">
                        Esqueceu a senha? <a href="#">Recuperar</a>
                    </p>
                </div>

                <div class="entrar">
                    <input type="submit" value="Entrar">
                </div>

            </form>

            <p class="cadastro">
                Novo aqui? <a href="#">Cadastre-se</a>
            </p>

        </div>
    </div>
</body>
</html>
